name: Division Dev Val Prod

on:
  workflow_dispatch:
    inputs:
      nombre:
        description: "Nombre de départ (entier)"
        required: true
        default: 64
        type: number

jobs:
  dev:
    name: Dev
    runs-on: ubuntu-latest
    outputs:
      resultat: ${{ steps.calcul.outputs.resultat }}
    steps:
      - name: Diviser par 2
        id: calcul
        env:
          NOMBRE: ${{ inputs.nombre }}
        run: |
          if (( NOMBRE % 2 != 0 )); then
            echo "::error::$NOMBRE / 2 ne donne pas un entier, donc pas pair. Arrêt."
            exit 1
          fi
          R=$(( NOMBRE / 2 ))
          echo "Dev : $NOMBRE / 2 = $R"
          if (( R % 2 != 0 )); then
            echo "::error::$R est impair. Arrêt de la pipeline."
            exit 1
          fi
          echo "resultat=$R" >> "$GITHUB_OUTPUT"

  val:
    name: Val
    needs: dev
    runs-on: ubuntu-latest
    outputs:
      resultat: ${{ steps.calcul.outputs.resultat }}
    steps:
      - name: Diviser par 4
        id: calcul
        env:
          NOMBRE: ${{ needs.dev.outputs.resultat }}
        run: |
          if (( NOMBRE % 4 != 0 )); then
            echo "::error::$NOMBRE / 4 ne donne pas un entier, donc pas pair. Arrêt."
            exit 1
          fi
          R=$(( NOMBRE / 4 ))
          echo "Val : $NOMBRE / 4 = $R"
          if (( R % 2 != 0 )); then
            echo "::error::$R est impair. Arrêt de la pipeline."
            exit 1
          fi
          echo "resultat=$R" >> "$GITHUB_OUTPUT"

  prod:
    name: Prod
    needs: val
    runs-on: ubuntu-latest
    steps:
      - name: Diviser par 8
        env:
          NOMBRE: ${{ needs.val.outputs.resultat }}
        run: |
          R=$(awk -v n="$NOMBRE" 'BEGIN { print n / 8 }')
          echo "Prod : $NOMBRE / 8 = $R"